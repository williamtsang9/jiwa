{% extends "base.html" %}

{% block content %}
  <section class="panel">
    <h2>Create Backlog Task</h2>
    <form method="post" action="/backlog/create" class="form-grid">
      <label>
        Title
        <input type="text" name="title" required>
      </label>
      <label>
        Description
        <textarea name="description" rows="3"></textarea>
      </label>
      <label>
        Priority
        <select name="priority">
          <option value="low">Low</option>
          <option value="medium" selected>Medium</option>
          <option value="high">High</option>
        </select>
      </label>
      <button type="submit">Add to Backlog</button>
    </form>
  </section>

  <section class="panel">
    <h2>Backlog Tasks</h2>
    {% if backlog_tasks %}
      <ul class="task-list">
        {% for task in backlog_tasks %}
          <li class="task-card">
            <form method="post" action="/task/update" class="form-inline">
              <input type="hidden" name="task_id" value="{{ task.id }}">
              <input type="hidden" name="next" value="/backlog">
              <input type="text" name="title" value="{{ task.title }}" required>
              <input type="text" name="description" value="{{ task.description }}" placeholder="Description">
              <select name="priority">
                <option value="low" {% if task.priority == "low" %}selected{% endif %}>Low</option>
                <option value="medium" {% if task.priority == "medium" %}selected{% endif %}>Medium</option>
                <option value="high" {% if task.priority == "high" %}selected{% endif %}>High</option>
              </select>
              <button type="submit">Save</button>
            </form>

            <div class="actions">
              <form method="post" action="/backlog/promote">
                <input type="hidden" name="task_id" value="{{ task.id }}">
                <button type="submit">Move to Board</button>
              </form>
              <form method="post" action="/task/delete">
                <input type="hidden" name="task_id" value="{{ task.id }}">
                <input type="hidden" name="next" value="/backlog">
                <button type="submit" class="danger">Delete</button>
              </form>
            </div>
          </li>
        {% endfor %}
      </ul>
    {% else %}
      <p>No backlog tasks yet.</p>
    {% endif %}
  </section>
{% endblock %}
